<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bóveda de Seguridad - Control de Acceso HMI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; font-size: 24px; }
    #status-box {
      margin: 10px 0;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      background-color: #333;
    }
    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #444;
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #007acc;
      color: white;
    }
    button:hover { background-color: #005999; }
  </style>
  <!-- Importar face-api.js local -->
  <script defer src="face-api.min.js"></script>
  <script defer src="app.js?v=2"></script>
</head>
<body>

  <h1>PRUEBA FACIAL</h1>
  <div id="status-box">Iniciando sistema... Cargando modelos...</div>

  <div class="video-container">
    <video id="videoInput" autoplay muted playsinline></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="btnConectarBT"></button>
    <button id="btnIniciarVoz" disabled></button>
  </div>

</body>
</html>
